<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuProfe20 Lab - Situaciones con fracciones</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
        
        body { margin: 0; padding: 0; overflow: hidden; width: 100vw; height: 100dvh; user-select: none; }
        .font-fun { font-family: 'Nunito', sans-serif; }
        
        @keyframes floatUp { 
            0% { transform: translateY(105vh) rotate(0deg); } 
            100% { transform: translateY(-105vh) rotate(360deg); } 
        }
        @keyframes slideInRight { 
            0% { opacity: 0; transform: translateX(15px); } 
            100% { opacity: 1; transform: translateX(0); } 
        }
        @keyframes confettiExplosion { 
            0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; } 
            80% { opacity: 1; } 
            100% { transform: translate(var(--tx), var(--ty)) scale(0) rotate(var(--rot)); opacity: 0; } 
        }
        @keyframes jellyPop {
            0% { transform: scale3d(.3, .3, .3); opacity: 0; }
            20% { transform: scale3d(1.18, 1.18, 1.18); }
            40% { transform: scale3d(.92, .92, .92); }
            60% { transform: scale3d(1.06, 1.06, 1.06); opacity: 1; }
            80% { transform: scale3d(.97, .97, .97); }
            100% { transform: scale3d(1, 1, 1); opacity: 1; }
        }
        @keyframes robotFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        @keyframes robotThinkTilt { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(6deg) translateY(-3px); } }
        @keyframes robotJump { 0%, 100% { transform: translateY(0); } 30% { transform: translateY(-15px); } }
        @keyframes robotTalkArmL { 0%, 100% { transform: rotate(45deg); } 50% { transform: rotate(95deg); } }
        @keyframes robotTalkArmR { 0%, 100% { transform: rotate(-45deg); } 50% { transform: rotate(-95deg); } }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        .animate-floatUp { animation: floatUp linear infinite; }
        .animate-slideInRight { animation: slideInRight 0.3s ease-out forwards; }
        .animate-confettiExplosion { animation: confettiExplosion 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .animate-jellyPop { animation: jellyPop 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-robotFloat { animation: robotFloat 3s ease-in-out infinite; }
        .animate-robotThinkTilt { animation: robotThinkTilt 2s ease-in-out infinite; }
        .animate-robotJump { animation: robotJump 1s cubic-bezier(0.28, 0.84, 0.42, 1) infinite; }
        .animate-robotTalkArmL { animation: robotTalkArmL 0.6s ease-in-out infinite; }
        .animate-robotTalkArmR { animation: robotTalkArmR 0.6s ease-in-out infinite 0.1s; }

        .katex { font-weight: 900 !important; }
        .katex-display { margin: 0 !important; padding: 0 !important; }
        
        .math-card .katex { font-size: clamp(0.9rem, 1.8vw, 1.25rem) !important; color: #1e293b !important; }
        .math-enunciado .katex { font-size: clamp(0.9rem, 1.8vw, 1.4rem) !important; color: #ffffff !important; }
        .math-current .katex { font-size: clamp(1rem, 2.5vw, 2.2rem) !important; color: #0f172a !important; }
        .math-history .katex { font-size: clamp(0.9rem, 2vw, 1.6rem) !important; color: #475569 !important; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, memo } = React;

        const Icon = ({ paths, className = "", size = 24, fill = "none", strokeWidth = "2.5" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className} dangerouslySetInnerHTML={{__html: paths}} />
        );

        const VolumeX = (p) => <Icon {...p} paths='<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>' />;
        const Volume2 = (p) => <Icon {...p} paths='<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>' />;
        const Rocket = (p) => <Icon {...p} paths='<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>' />;
        const Sparkles = (p) => <Icon {...p} paths='<path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M3 5h4"/><path d="M19 3v4"/><path d="M17 5h4"/>' />;
        const Home = (p) => <Icon {...p} paths='<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>' />;
        const ChevronLeft = (p) => <Icon {...p} paths='<polyline points="15 18 9 12 15 6"/>' />;
        const ChevronRight = (p) => <Icon {...p} paths='<polyline points="9 18 15 12 9 6"/>' />;

        const AudioController = {
            ctx: null, muted: false,
            init: function() {
                if (this.ctx) return;
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) this.ctx = new AudioContext();
            },
            play: function(type) {
                if (this.muted || !this.ctx) return;
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                const now = this.ctx.currentTime;
                
                if (type === 'pop') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(500, now); osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                    gain.gain.setValueAtTime(0.25, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                } else if (type === 'pop-reverse') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(650, now); osc.frequency.exponentialRampToValueAtTime(280, now + 0.12);
                    gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                    osc.start(now); osc.stop(now + 0.12);
                } else if (type === 'success') {
                    osc.disconnect();
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, i) => {
                        const o = this.ctx.createOscillator(); const g = this.ctx.createGain();
                        o.type = 'triangle'; o.frequency.value = freq;
                        o.connect(g); g.connect(this.ctx.destination);
                        const startTime = now + (i * 0.07);
                        g.gain.setValueAtTime(0, startTime); g.gain.linearRampToValueAtTime(0.2, startTime + 0.04); g.gain.linearRampToValueAtTime(0, startTime + 0.35);
                        o.start(startTime); o.stop(startTime + 0.35);
                    });
                } else if (type === 'swoosh') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(280, now); osc.frequency.exponentialRampToValueAtTime(70, now + 0.18);
                    gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.18);
                    osc.start(now); osc.stop(now + 0.18);
                }
            },
            toggleMute: function() { this.muted = !this.muted; return this.muted; }
        };

        const MathDisplay = memo(({ latex, className = "", inline = false }) => {
            const containerRef = useRef(null);

            useEffect(() => {
                if (containerRef.current && window.katex) {
                    try {
                        window.katex.render(latex, containerRef.current, {
                            displayMode: !inline, throwOnError: false, strict: false, trust: true
                        });
                    } catch (e) {
                        containerRef.current.innerText = latex;
                    }
                }
            }, [latex, inline]);

            return inline ? (
                <span ref={containerRef} className={`inline-block align-middle ${className}`} />
            ) : (
                <div className={`relative w-full flex justify-center ${className}`}>
                    <div ref={containerRef} className="w-full text-center" />
                </div>
            );
        });

        const FractionGraphic = memo(({ num, den, color = "bg-blue-500", label = "" }) => {
            const boxes = [];
            for (let i = 0; i < den; i++) {
                boxes.push(<div key={i} className={`flex-1 border-2 border-slate-700 h-6 sm:h-10 ${i < num ? color : 'bg-white opacity-40'} transition-all`} />);
            }
            return (
                <div className="w-full max-w-sm mx-auto my-1 flex flex-col items-center">
                    {label && <span className="font-bold text-xs sm:text-sm text-slate-700 mb-1 bg-white/80 px-2 py-0.5 rounded shadow-sm">{label}</span>}
                    <div className="w-full flex rounded-lg overflow-hidden shadow-md bg-slate-200">{boxes}</div>
                    <div className="mt-1 font-black text-sm sm:text-base text-slate-600">{num}/{den}</div>
                </div>
            );
        });

        const EXERCISES = [
            {
                id: 1, title: "Ejercicio 1", subtitle: "Barriles de Gasolina",
                cardGradient: "from-blue-500/30 to-cyan-600/30 border-blue-400", badgeColor: "bg-blue-500",
                enunciado: () => <span>Se tienen 2 barriles. Con el 1º se llenaron 18 botellas de <MathDisplay inline latex="2/3" /> L y con el 2º, 16 botellas de <MathDisplay inline latex="3/4" /> L. ¿Cuál tenía mayor cantidad?</span>,
                steps: [
                    { latex: String.raw`1^\circ = 18 \times \frac{2}{3} \quad , \quad 2^\circ = 16 \times \frac{3}{4}`, propertyText: "Planteando", robotSpeech: "Calcularemos el total de litros multiplicando la cantidad de botellas por la capacidad de cada una." },
                    { latex: String.raw`1^\circ = \frac{18 \times 2}{3} = 12 \text{ L}`, propertyText: "Primer Barril", robotSpeech: "En el primer barril obtenemos 12 litros exactos.", graphic: <FractionGraphic num={2} den={3} color="bg-blue-500" label="Botella 1 (2/3 L)" /> },
                    { latex: String.raw`2^\circ = \frac{16 \times 3}{4} = 12 \text{ L}`, propertyText: "Segundo Barril", robotSpeech: "En el segundo barril también obtenemos 12 litros.", graphic: <FractionGraphic num={3} den={4} color="bg-cyan-500" label="Botella 2 (3/4 L)" /> },
                    { latex: String.raw`12 \text{ L} = 12 \text{ L} \implies \text{Iguales}`, propertyText: "Conclusión", robotSpeech: "¡Ambos barriles tenían exactamente la misma cantidad de gasolina!" }
                ]
            },
            {
                id: 2, title: "Ejercicio 2", subtitle: "Gastos en Compras",
                cardGradient: "from-pink-500/30 to-rose-600/30 border-pink-400", badgeColor: "bg-pink-500",
                enunciado: () => <span>Jeny llevó S/120 y Dalina S/150. Jeny gastó <MathDisplay inline latex="7/10" /> y a Dalina le sobró <MathDisplay inline latex="4/15" />. ¿Diferencia entre lo que gastaron?</span>,
                steps: [
                    { latex: String.raw`G_J = \frac{7}{10} \times 120 = 84`, propertyText: "Gasto de Jeny", robotSpeech: "Jeny gastó 7/10 de 120, simplificando resulta en 84 soles.", graphic: <FractionGraphic num={7} den={10} color="bg-pink-500" label="Gasto Jeny" /> },
                    { latex: String.raw`G_D = \left(1 - \frac{4}{15}\right) \times 150`, propertyText: "Análisis Dalina", robotSpeech: "Si a Dalina le sobró 4/15, significa que gastó el resto: 11/15 del total." },
                    { latex: String.raw`G_D = \frac{11}{15} \times 150 = 110`, propertyText: "Gasto de Dalina", robotSpeech: "Multiplicando 11/15 por 150, obtenemos que Dalina gastó 110 soles.", graphic: <FractionGraphic num={11} den={15} color="bg-rose-500" label="Gasto Dalina" /> },
                    { latex: String.raw`110 - 84 = 26`, propertyText: "Diferencia", robotSpeech: "Restamos los gastos: 110 - 84. La diferencia es de 26 soles." }
                ]
            },
            {
                id: 3, title: "Ejercicio 3", subtitle: "Jardineros",
                cardGradient: "from-green-500/30 to-emerald-600/30 border-green-400", badgeColor: "bg-green-500",
                enunciado: () => <span>Jardín de <MathDisplay inline latex="24 m^2" /> repartido a la mitad. A Manuel le falta <MathDisplay inline latex="1/12" /> de su parte y a Luis <MathDisplay inline latex="2/24" /> de la suya. ¿Cuánto avanzaron?</span>,
                steps: [
                    { latex: String.raw`\text{Mitad} = \frac{24}{2} = 12 \text{ m}^2`, propertyText: "Trabajo Equitativo", robotSpeech: "Cada uno debe trabajar la mitad del jardín, es decir, 12 metros cuadrados." },
                    { latex: String.raw`\text{Manuel: falta } \frac{1}{12} \times 12 = 1 \text{ m}^2`, propertyText: "Avance Manuel", robotSpeech: "A Manuel le falta 1 metro. Por ende, avanzó 12 - 1 = 11 metros." },
                    { latex: String.raw`\text{Luis: falta } \frac{2}{24} \times 12 = \frac{1}{12} \times 12 = 1 \text{ m}^2`, propertyText: "Avance Luis", robotSpeech: "2/24 equivale a 1/12. A Luis también le falta 1 metro, avanzó 11 metros." },
                    { latex: String.raw`11 + 11 = 22 \text{ m}^2`, propertyText: "Total Avanzado", robotSpeech: "Sumando ambos avances, trabajaron un total de 22 metros cuadrados." }
                ]
            },
            {
                id: 4, title: "Ejercicio 4", subtitle: "Asistentes al Cine",
                cardGradient: "from-purple-500/30 to-indigo-600/30 border-purple-400", badgeColor: "bg-purple-500",
                enunciado: () => <span>Mujeres son <MathDisplay inline latex="3/11" /> de los varones. Total = 140. Calcula la diferencia entre varones y mujeres.</span>,
                steps: [
                    { latex: String.raw`M = \frac{3}{11}V \implies \frac{M}{V} = \frac{3k}{11k}`, propertyText: "Proporción", robotSpeech: "Las mujeres representan 3 partes (3k) y los varones 11 partes (11k)." },
                    { latex: String.raw`3k + 11k = 140 \implies 14k = 140`, propertyText: "Total Asistentes", robotSpeech: "Sumamos las partes e igualamos al total de asistentes para hallar 'k'." },
                    { latex: String.raw`k = 10 \implies M=30, V=110`, propertyText: "Cantidades", robotSpeech: "Sabiendo que k=10, hay 30 mujeres y 110 varones." },
                    { latex: String.raw`V - M = 110 - 30 = 80`, propertyText: "Diferencia", robotSpeech: "La diferencia pedida es 110 - 30 = 80." }
                ]
            },
            {
                id: 5, title: "Ejercicio 5", subtitle: "Equivalencias",
                cardGradient: "from-amber-500/30 to-orange-600/30 border-amber-400", badgeColor: "bg-amber-500",
                enunciado: () => <span>Se tienen dos fracciones equivalentes a <MathDisplay inline latex="5/3" /> (Asumido). Suma de numeradores=85, diferencia de denominadores=9. Halla el mayor numerador.</span>,
                steps: [
                    { latex: String.raw`F_1 = \frac{5x}{3x} \quad , \quad F_2 = \frac{5y}{3y}`, propertyText: "Fracciones", robotSpeech: "Definimos dos fracciones equivalentes a 5/3 multiplicadas por factores x e y." },
                    { latex: String.raw`5x + 5y = 85 \implies x + y = 17`, propertyText: "Suma Numeradores", robotSpeech: "La suma de los numeradores es 85. Simplificando entre 5, x+y=17." },
                    { latex: String.raw`3x - 3y = 9 \implies x - y = 3`, propertyText: "Diferencia Denominadores", robotSpeech: "La diferencia de denominadores es 9. Simplificando entre 3, x-y=3." },
                    { latex: String.raw`x=10, y=7 \implies 5(10) = 50`, propertyText: "Mayor Numerador", robotSpeech: "Resolviendo el sistema obtenemos x=10. El mayor numerador es 5(10) = 50." }
                ]
            },
            {
                id: 6, title: "Ejercicio 6", subtitle: "Región Sombreada",
                cardGradient: "from-slate-500/30 to-gray-600/30 border-slate-400", badgeColor: "bg-slate-500",
                enunciado: () => <span>¿Qué fracción representa el área de la región sombreada respecto de la no sombreada? (Ejemplo: 3 de 5 sombreadas)</span>,
                steps: [
                    { latex: String.raw`\text{Total partes} = 5`, propertyText: "Observando el Gráfico", robotSpeech: "Asumamos un gráfico dividido en 5 partes iguales.", graphic: <FractionGraphic num={3} den={5} color="bg-slate-700" label="Sombreadas vs Total" /> },
                    { latex: String.raw`\text{Sombreadas} = 3, \text{No Sombreadas} = 2`, propertyText: "Identificando Regiones", robotSpeech: "Si 3 partes están sombreadas, el resto (2 partes) no lo están." },
                    { latex: String.raw`\text{Razón} = \frac{\text{Sombreada}}{\text{No Sombreada}} = \frac{3}{2}`, propertyText: "Fracción Solución", robotSpeech: "La relación entre el área sombreada y la no sombreada es 3/2." }
                ]
            },
            {
                id: 7, title: "Ejercicio 7", subtitle: "Fracción Equivalente",
                cardGradient: "from-fuchsia-500/30 to-violet-600/30 border-fuchsia-400", badgeColor: "bg-fuchsia-500",
                enunciado: () => <span>Si la fracción <MathDisplay inline latex="\frac{3a+1}{20}" /> es equivalente a <MathDisplay inline latex="4/5" /> (Asumido), halla <MathDisplay inline latex="a^2 + a" />.</span>,
                steps: [
                    { latex: String.raw`\frac{3a+1}{20} = \frac{4}{5}`, propertyText: "Igualdad", robotSpeech: "Igualamos la fracción dada a su equivalente 4/5." },
                    { latex: String.raw`5(3a+1) = 80 \implies 3a+1 = 16`, propertyText: "Despejando", robotSpeech: "Multiplicamos en aspa o simplemente pasamos el 20 a multiplicar: (20*4)/5 = 16." },
                    { latex: String.raw`3a = 15 \implies a = 5`, propertyText: "Valor de 'a'", robotSpeech: "Descubrimos que el valor de 'a' es exactamente 5." },
                    { latex: String.raw`a^2 + a = 5^2 + 5 = 25 + 5 = 30`, propertyText: "Cálculo Final", robotSpeech: "Reemplazamos 'a' en la expresión pedida: 25 + 5 = 30." }
                ]
            },
            {
                id: 8, title: "Ejercicio 8", subtitle: "Ecuación Fraccionaria",
                cardGradient: "from-teal-500/30 to-cyan-600/30 border-teal-400", badgeColor: "bg-teal-500",
                enunciado: () => <span>Si se cumple que <MathDisplay inline latex="\frac{7b+3}{5b+1} = \frac{52}{36}" />, halla <MathDisplay inline latex="\frac{b}{3} + \frac{3}{b}" />.</span>,
                steps: [
                    { latex: String.raw`\frac{52}{36} = \frac{13}{9}`, propertyText: "Simplificando", robotSpeech: "Primero, simplificamos la fracción de la derecha sacando cuarta." },
                    { latex: String.raw`9(7b+3) = 13(5b+1)`, propertyText: "Multiplicación en Aspa", robotSpeech: "Multiplicamos de forma cruzada para eliminar los denominadores." },
                    { latex: String.raw`63b + 27 = 65b + 13 \implies 14 = 2b \implies b=7`, propertyText: "Resolviendo", robotSpeech: "Agrupamos las 'b' a un lado y los números al otro. Obtenemos b = 7." },
                    { latex: String.raw`\frac{7}{3} + \frac{3}{7} = \frac{49 + 9}{21} = \frac{58}{21}`, propertyText: "Suma de Fracciones", robotSpeech: "Reemplazamos 'b' y sumamos las fracciones usando el método del aspa." }
                ]
            },
            {
                id: 9, title: "Ejercicio 9", subtitle: "Términos Consecutivos",
                cardGradient: "from-red-500/30 to-rose-600/30 border-red-400", badgeColor: "bg-red-500",
                enunciado: () => <span>Denominador excede al numerador en 1. Si se agrega 1 a ambos, la nueva fracción excede a la original en <MathDisplay inline latex="1/72" />. Halla la fracción original.</span>,
                steps: [
                    { latex: String.raw`\frac{x}{x+1}`, propertyText: "Fracción Original", robotSpeech: "Si el denominador excede en 1 al numerador, la fracción tiene la forma x / (x+1)." },
                    { latex: String.raw`\frac{x+1}{x+2} - \frac{x}{x+1} = \frac{1}{72}`, propertyText: "Planteo del Problema", robotSpeech: "Al agregar 1 a cada término, la diferencia con la original es 1/72." },
                    { latex: String.raw`\frac{(x+1)^2 - x(x+2)}{(x+2)(x+1)} = \frac{1}{72}`, propertyText: "Operando", robotSpeech: "Operamos las fracciones. Al desarrollar el numerador queda exactamente 1." },
                    { latex: String.raw`\frac{1}{x^2+3x+2} = \frac{1}{72} \implies x=7 \implies \text{Frac: } \frac{7}{8}`, propertyText: "Solución", robotSpeech: "El denominador debe ser 72. Al resolver la ecuación cuadrática hallamos x=7. ¡La fracción es 7/8!" }
                ]
            },
            {
                id: 10, title: "Ejercicio 10", subtitle: "Suma de Términos",
                cardGradient: "from-lime-500/30 to-green-600/30 border-lime-400", badgeColor: "bg-lime-500",
                enunciado: () => <span>Halla la diferencia de términos de una fracción equivalente a <MathDisplay inline latex="33/22" />, si la suma de sus términos es el mayor número de dos cifras.</span>,
                steps: [
                    { latex: String.raw`\frac{33}{22} = \frac{3}{2} \implies F = \frac{3k}{2k}`, propertyText: "Simplificación", robotSpeech: "Simplificamos 33/22 sacando onceava. Nos queda 3/2, así que los términos son 3k y 2k." },
                    { latex: String.raw`3k + 2k = 5k`, propertyText: "Suma Múltiplo de 5", robotSpeech: "La suma de los términos es 5k, lo que indica que debe ser un múltiplo de 5." },
                    { latex: String.raw`5k = 95 \implies k=19`, propertyText: "Mayor de 2 cifras", robotSpeech: "El mayor múltiplo de 5 de dos cifras es 95. Igualamos y hallamos k=19." },
                    { latex: String.raw`3k - 2k = k = 19`, propertyText: "Diferencia", robotSpeech: "Nos piden la diferencia de los términos, que es exactamente 'k', o sea 19." }
                ]
            },
            {
                id: 11, title: "Ejercicio 11", subtitle: "Fracción Equivalente II",
                cardGradient: "from-sky-500/30 to-blue-600/30 border-sky-400", badgeColor: "bg-sky-500",
                enunciado: () => <span>Halla una fracción equivalente a <MathDisplay inline latex="3/5" />, tal que la suma de sus términos sea 40.</span>,
                steps: [
                    { latex: String.raw`F = \frac{3k}{5k}`, propertyText: "Planteo", robotSpeech: "Al ser equivalente a 3/5, sus términos están en la relación de 3k y 5k." },
                    { latex: String.raw`3k + 5k = 40 \implies 8k = 40`, propertyText: "Suma de Términos", robotSpeech: "Sumamos los términos e igualamos a 40." },
                    { latex: String.raw`k = 5 \implies F = \frac{15}{25}`, propertyText: "Fracción Solución", robotSpeech: "Como k=5, multiplicamos para hallar los términos: 3(5)=15 y 5(5)=25." }
                ]
            },
            {
                id: 12, title: "Ejercicio 12", subtitle: "Propiedad de Proporciones",
                cardGradient: "from-indigo-500/30 to-purple-600/30 border-indigo-400", badgeColor: "bg-indigo-500",
                enunciado: () => <span>Dos fracciones equivalentes de términos diferentes. Suma de numeradores = 25, suma de denominadores = 55. Cociente de diferencia de num entre dif de den.</span>,
                steps: [
                    { latex: String.raw`\frac{a}{b} = \frac{c}{d} = k`, propertyText: "Fracciones", robotSpeech: "Sean dos fracciones equivalentes, ambas iguales a una constante k." },
                    { latex: String.raw`\frac{a+c}{b+d} = k \implies \frac{25}{55} = \frac{5}{11}`, propertyText: "Propiedad de Suma", robotSpeech: "Por propiedad de proporciones, la suma de antecedentes entre la suma de consecuentes mantiene la constante k." },
                    { latex: String.raw`\frac{a-c}{b-d} = k = \frac{5}{11}`, propertyText: "Propiedad de Resta", robotSpeech: "De igual forma, la resta mantiene la misma constante k. ¡El cociente pedido es 5/11!" }
                ]
            },
            {
                id: 13, title: "Ejercicio 13", subtitle: "Igualdad Fraccionaria",
                cardGradient: "from-yellow-500/30 to-amber-600/30 border-yellow-400", badgeColor: "bg-yellow-500",
                enunciado: () => <span>Si se cumple que <MathDisplay inline latex="\frac{5a+1}{17} = \frac{63}{51}" />, calcula <MathDisplay inline latex="a^3 + a^2 + a" />.</span>,
                steps: [
                    { latex: String.raw`\frac{63}{51} = \frac{21}{17}`, propertyText: "Simplificando", robotSpeech: "Simplificamos 63/51 sacando tercia a ambos términos." },
                    { latex: String.raw`\frac{5a+1}{17} = \frac{21}{17} \implies 5a+1 = 21`, propertyText: "Igualando Numeradores", robotSpeech: "Como los denominadores son iguales (17), los numeradores también deben serlo." },
                    { latex: String.raw`5a = 20 \implies a = 4`, propertyText: "Hallando 'a'", robotSpeech: "Despejamos y encontramos que a = 4." },
                    { latex: String.raw`4^3 + 4^2 + 4 = 64 + 16 + 4 = 84`, propertyText: "Reemplazando", robotSpeech: "Evaluamos la expresión pedida y la suma final es 84." }
                ]
            },
            {
                id: 14, title: "Ejercicio 14", subtitle: "Diferencia de Cuadrados",
                cardGradient: "from-orange-500/30 to-red-600/30 border-orange-400", badgeColor: "bg-orange-500",

                steps: [
                    { latex: String.raw`\frac{12}{16} = \frac{3}{4} \implies F = \frac{3k}{4k}`, propertyText: "Simplificando", robotSpeech: "Simplificamos 12/16 sacando cuarta, y usamos la constante k." },
                    { latex: String.raw`(4k)^2 - (3k)^2 = 63`, propertyText: "Diferencia", robotSpeech: "Planteamos la diferencia de cuadrados igualada a 63." },
                    { latex: String.raw`16k^2 - 9k^2 = 7k^2 = 63 \implies k^2=9`, propertyText: "Resolviendo", robotSpeech: "Restamos los términos semejantes y obtenemos k al cuadrado = 9, o sea k=3." },
                    { latex: String.raw`F = \frac{3(3)}{4(3)} = \frac{9}{12}`, propertyText: "Fracción Final", robotSpeech: "Reemplazando k=3, la fracción es 9/12." }
                ]
            },
            {
                id: 15, title: "Ejercicio 15", subtitle: "MCM de Términos",
                cardGradient: "from-emerald-500/30 to-teal-600/30 border-emerald-400", badgeColor: "bg-emerald-500",
                enunciado: () => <span>Fracción equivalente a <MathDisplay inline latex="14/30" /> tiene como MCM de sus términos 945. Calcula el término menor.</span>,
                steps: [
                    { latex: String.raw`\frac{14}{30} = \frac{7}{15} \implies F = \frac{7k}{15k}`, propertyText: "Simplificación", robotSpeech: "Simplificamos 14/30 a 7/15." },
                    { latex: String.raw`\text{MCM}(7k, 15k) = 105k`, propertyText: "Cálculo del MCM", robotSpeech: "El mínimo común múltiplo de 7k y 15k es el producto de sus factores: 105k." },
                    { latex: String.raw`105k = 945 \implies k=9`, propertyText: "Igualando", robotSpeech: "Igualamos el MCM al dato dado y obtenemos que k=9." },
                    { latex: String.raw`\text{Menor} = 7(9) = 63`, propertyText: "Término Menor", robotSpeech: "El término menor es 7k, que equivale a 63." }
                ]
            },
            {
                id: 16, title: "Ejercicio 16", subtitle: "Equipos de Fulbito",
                cardGradient: "from-blue-600/30 to-indigo-700/30 border-blue-500", badgeColor: "bg-blue-600",
                enunciado: () => <span>6 equipos con 12 integrantes c/u. Si <MathDisplay inline latex="17/24" /> usan zapatillas importadas, ¿cuántos usan zapatillas nacionales?</span>,
                steps: [
                    { latex: String.raw`\text{Total} = 6 \times 12 = 72 \text{ personas}`, propertyText: "Total Integrantes", robotSpeech: "Multiplicamos la cantidad de equipos por sus integrantes." },
                    { latex: String.raw`\text{Nacionales} = 1 - \frac{17}{24} = \frac{7}{24}`, propertyText: "Fracción Restante", robotSpeech: "Si 17/24 usan importadas, el resto para llegar a 1 (que es 7/24) usan nacionales." },
                    { latex: String.raw`\text{Cant.} = \frac{7}{24} \times 72`, propertyText: "Planteo Final", robotSpeech: "Multiplicamos la fracción de zapatillas nacionales por el total de personas." },
                    { latex: String.raw`\text{Cant.} = 7 \times 3 = 21`, propertyText: "Resultado", robotSpeech: "Simplificamos 72 entre 24 que es 3, y multiplicamos por 7. ¡Son 21 estudiantes!" }
                ]
            }
        ];

        const FloatingBackground = memo(() => {
            const symbols = ['<', '>', '≤', '≥', 'x', 'y', '∞', '+', '-'];
            const elements = Array.from({ length: 40 }).map((_, i) => ({
                id: i, symbol: symbols[Math.floor(Math.random() * symbols.length)], left: `${Math.random() * 100}%`,
                animationDuration: `${10 + Math.random() * 15}s`, animationDelay: `-${Math.random() * 20}s`,
                fontSize: `${1 + Math.random() * 3}rem`, opacity: 0.1 + Math.random() * 0.15
            }));
            return (
                <div className="absolute inset-0 overflow-hidden pointer-events-none z-0">
                    {elements.map((el) => (
                        <div key={el.id} className="absolute text-white font-black animate-floatUp select-none drop-shadow-lg" style={{ left: el.left, bottom: '-15%', fontSize: el.fontSize, opacity: el.opacity, animationDuration: el.animationDuration, animationDelay: el.animationDelay }}>
                            {el.symbol}
                        </div>
                    ))}
                </div>
            );
        });

        const Confetti = memo(() => {
            const colors = ['#fde047', '#60a5fa', '#f472b6', '#34d399', '#a78bfa', '#ff5722'];

            }));
            return (
                <div className="absolute inset-0 pointer-events-none z-50 flex items-center justify-center overflow-hidden">
                    {pieces.map((p) => (
                        <div key={p.id} className="absolute w-4 h-4 sm:w-5 sm:h-5 rounded-full animate-confettiExplosion shadow-sm" style={{ backgroundColor: p.color, '--tx': p.tx, '--ty': p.ty, '--rot': p.rot, animationDelay: p.delay, left: p.left, top: '50%' }} />
                    ))}
                </div>
            );
        });

        const RobotAssistant = ({ step, maxSteps }) => {
            const isFinalStep = step >= maxSteps;
            const isThinking = step === maxSteps - 1;

            const getContainerAnim = () => { if (isFinalStep) return 'animate-robotJump'; if (isThinking) return 'animate-robotThinkTilt'; return 'animate-robotFloat'; };
            const getArmLAnim = () => { if (isFinalStep) return 'rotate-[150deg] animate-pulse'; if (step > 0) return 'animate-robotTalkArmL'; return 'rotate-45'; };
            const getArmRAnim = () => { if (isFinalStep) return '-rotate-[150deg] animate-pulse'; if (step > 0) return 'animate-robotTalkArmR'; return '-rotate-45'; };
            
            const getEyes = () => {
                if (isFinalStep) return <div className="w-full flex justify-between px-1.5"><div className="w-3.5 h-2 bg-emerald-400 rounded-t-full mt-1"></div><div className="w-3.5 h-2 bg-emerald-400 rounded-t-full mt-1"></div></div>;
                if (step === 0) return <div className="w-full flex justify-between px-2"><div className="w-2.5 h-2.5 bg-cyan-400 rounded-full animate-pulse"></div><div className="w-2.5 h-2.5 bg-cyan-400 rounded-full animate-pulse"></div></div>;
                return <div className="w-full flex justify-between px-1.5"><div className="w-3 h-3 bg-yellow-400 rounded-full animate-bounce"></div><div className="w-3 h-3 bg-yellow-400 rounded-full animate-bounce"></div></div>;
            };
            const getMouth = () => {
                if (isFinalStep) return <div className="w-6 h-3.5 bg-rose-400 rounded-b-full mt-1.5"></div>;
                if (step === 0) return <div className="w-4 h-1.5 bg-cyan-300 rounded-full mt-2"></div>;
                return <div className="w-3.5 h-3.5 bg-rose-400 rounded-full mt-1 animate-ping"></div>;
            };

            return (
                <div className={`relative flex flex-col items-center drop-shadow-lg select-none ${getContainerAnim()}`}>
                    <div className="relative z-0 flex flex-col items-center translate-y-1">
                        <div className={`w-3.5 h-3.5 rounded-full shadow-[0_0_10px_currentColor] z-10 transition-colors duration-300 ${isFinalStep ? 'text-emerald-400 bg-emerald-400' : 'text-yellow-400 bg-yellow-400 animate-pulse'}`}></div>
                        <div className="w-1.5 h-4 bg-slate-300"></div>
                    </div>
                    <div className="relative z-10 w-16 h-16 sm:w-20 sm:h-20 bg-gradient-to-br from-white to-slate-200 rounded-[1.2rem] border-[3px] border-indigo-400 shadow-xl flex flex-col items-center justify-center p-1.5">
                        <div className="w-full h-full bg-slate-900 rounded-lg flex flex-col items-center justify-center p-1.5 shadow-inner border-2 border-indigo-500">
                            {getEyes()} {getMouth()}
                        </div>
                    </div>
                    <div className={`absolute top-1/2 -left-2 w-3 h-5 bg-slate-200 border-[2.5px] border-indigo-400 rounded-full z-0 origin-top ${getArmLAnim()}`}></div>
                    <div className={`absolute top-1/2 -right-2 w-3 h-5 bg-slate-200 border-[2.5px] border-indigo-400 rounded-full z-0 origin-top ${getArmRAnim()}`}></div>
                </div>
            );
        };

        function App() {
            const [view, setView] = useState('home');
            const [exIdx, setExIdx] = useState(0);
            const [step, setStep] = useState(0);
            const [isMuted, setIsMuted] = useState(false);
            const scrollContainerRef = useRef(null);

            const currentExercise = EXERCISES[exIdx];
            const maxSteps = currentExercise.steps.length - 1;
            const currentStepData = currentExercise.steps[step];
            const EnunciadoText = currentExercise.enunciado;

            const handleInteraction = () => AudioController.init();

            useEffect(() => {
                if(scrollContainerRef.current) {
                    scrollContainerRef.current.scrollTop = scrollContainerRef.current.scrollHeight;
                }
            }, [step, exIdx, view]);

            const startExercise = (index) => {
                handleInteraction();
                AudioController.play('swoosh');
                setExIdx(index);
                setStep(0);
                setView('lab');
            };

            const nextStep = () => {
                handleInteraction();
                if (step < maxSteps) {
                    const next = step + 1;
                    setStep(next);
                    if (next === maxSteps) AudioController.play('success');
                    else AudioController.play('pop');
                } else {
                    if (exIdx < EXERCISES.length - 1) {
                        AudioController.play('swoosh');
                        setExIdx(exIdx + 1);
                        setStep(0);
                    } else {
                        AudioController.play('swoosh');
                        setView('home');
                    }
                }
            };

            const prevStep = () => {
                handleInteraction();
                if (step > 0) {
                    setStep(step - 1);
                    AudioController.play('pop-reverse');

            };

            const toggleMute = () => { handleInteraction(); setIsMuted(AudioController.toggleMute()); };

            if (view === 'home') {
                return (
                    <div className="w-screen min-h-[100dvh] bg-gradient-to-br from-[#1e3a8a] via-[#4338ca] to-[#be185d] flex flex-col items-center justify-start p-4 sm:p-6 relative font-fun overflow-y-auto overflow-x-hidden scrollbar-hide">

                        <div className="w-[96%] max-w-[1400px] z-20 flex items-center justify-between mb-8 sm:mb-12 mt-2">

                                <Rocket className="w-5 h-5 text-yellow-300" /> TuProfe20 Lab
                            </div>

                                {isMuted ? <VolumeX className="w-5 h-5 sm:w-6 sm:h-6" /> : <Volume2 className="w-5 h-5 sm:w-6 sm:h-6" />}
                            </button>
                        </div>

                        <div className="relative z-10 text-center w-[96%] max-w-[1400px] flex flex-col items-center">

                                Resolución de <span className="text-yellow-300 underline decoration-wavy decoration-cyan-400">Fracciones</span>
                            </h1>
                            <p className="text-base sm:text-xl lg:text-2xl text-purple-100 mb-8 sm:mb-12 font-bold max-w-3xl leading-relaxed">
                                ¡Aprende a resolver problemas con fracciones paso a paso! 📈🤖
                            </p>

                            <div className="w-full grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-4 sm:gap-6 mb-12">
                                {EXERCISES.map((ex, idx) => (
                                    <button
                                        key={ex.id}
                                        onClick={() => startExercise(idx)}
                                        className="group text-left p-4 sm:p-5 rounded-[1.5rem] bg-gradient-to-br bg-opacity-90 backdrop-blur-xl border-[3px] border-white/40 hover:-translate-y-2 hover:shadow-[0_15px_30px_rgba(0,0,0,0.3)] transition-all flex flex-col relative overflow-hidden shadow-lg min-h-[10rem] sm:min-h-[12rem]"
                                        style={{ backgroundImage: `linear-gradient(to bottom right, var(--tw-gradient-stops))` }}
                                    >
                                        <div className={`absolute inset-0 opacity-80 ${ex.cardGradient}`}></div>
                                        <div className="relative z-10 flex-1 flex flex-col">
                                            <div className="flex items-center justify-between mb-3">
                                                <span className={`${ex.badgeColor} text-white text-xs sm:text-sm font-black px-3 py-1 rounded-md uppercase tracking-widest shadow-sm shrink-0`}>
                                                    Reto {ex.id}
                                                </span>
                                                <span className="bg-black/20 text-white text-xs font-bold px-2 py-1 rounded-md">
                                                    {ex.steps.length} pasos
                                                </span>
                                            </div>
                                            <div className="flex-1 my-2 bg-white/95 rounded-xl p-3 text-slate-900 shadow-inner overflow-hidden flex items-center justify-center border border-white/60 w-full pointer-events-none math-card">
                                                <span className="text-[0.9rem] sm:text-base font-bold text-center">{ex.subtitle}</span>
                                            </div>
                                        </div>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="w-screen h-[100dvh] bg-gradient-to-br from-[#0f172a] via-[#312e81] to-[#831843] text-slate-800 flex flex-col p-2 sm:p-4 relative font-fun overflow-hidden">
                    <FloatingBackground />
                    {step === maxSteps && <Confetti />}

                    {/* Navbar InGame */}
                    <div className="shrink-0 relative z-10 w-[96%] max-w-[1400px] mx-auto flex justify-between items-center mb-3 sm:mb-4 px-1">

                            <Home className="w-5 h-5 sm:mr-2" />
                            <span className="hidden sm:inline">Portada</span>
                        </button>

                        <div className="flex items-center gap-1.5 sm:gap-2 bg-black/30 p-1.5 sm:p-2 rounded-[1rem] sm:rounded-[1.2rem] border-2 border-white/20 backdrop-blur-md shadow-lg overflow-x-auto scrollbar-hide max-w-[50vw]">

                                    onClick={() => startExercise(i)}

                                    {ex.id}

                        {/* Enunciado Area */}

                                    <Sparkles className="w-5 h-5 sm:w-6 sm:h-6" /> 
                                    <span>{currentStepData.propertyText}</span>
                                </span>
                            </div>

                            {/* Contenedor escrolleable */}
                            <div ref={scrollContainerRef} className="w-full flex-1 flex flex-col items-center justify-start z-10 px-2 space-y-4 sm:space-y-6 overflow-y-auto scrollbar-hide pb-4">
                                {currentExercise.steps.slice(0, step + 1).map((s, idx) => (
                                    <div key={`${exIdx}-${idx}`} className={`transition-all duration-300 w-full max-w-3xl flex flex-col items-center ${idx === step ? 'opacity-100 scale-100 animate-slideInRight' : 'opacity-60 scale-95'}`}>
                                        
                                        <div className={`px-4 py-3 sm:px-8 sm:py-4 w-fit max-w-full text-center rounded-[1.5rem] sm:rounded-[2rem] flex items-center justify-center min-h-[4rem] sm:min-h-[5rem] overflow-x-auto scrollbar-hide ${
                                            idx === step 
                                            ? (step === maxSteps ? 'bg-[#fde047] border-[4px] sm:border-[6px] border-[#eab308] shadow-[0_15px_30px_rgba(234,179,8,0.5)] math-current' : 'bg-white border-[4px] sm:border-[6px] border-blue-400 shadow-[0_10px_25px_rgba(59,130,246,0.3)] math-current') 
                                            : 'bg-white/70 border-[2px] sm:border-[3px] border-slate-200 math-history'
                                        }`}>
                                            <MathDisplay latex={s.latex} />
                                        </div>
                                        
                                        {/* Gráfico Opcional si existe en el paso */}
                                        {s.graphic && (
                                            <div className={`mt-4 w-full bg-white rounded-2xl border-2 border-slate-200 p-4 shadow-sm ${idx === step ? 'border-blue-300' : ''}`}>
                                                {s.graphic}
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Zona Inferior: Robot y Feedback */}
                        <div className="shrink-0 bg-white w-full px-4 py-2 sm:px-8 sm:py-3 flex items-center gap-4 sm:gap-6 border-t-[4px] border-slate-100 z-20 relative shadow-[0_-10px_20px_rgba(0,0,0,0.05)]">
                            <div className="shrink-0 absolute -top-12 sm:relative sm:-top-0 left-4 sm:left-0 drop-shadow-xl">
                                <RobotAssistant step={step} maxSteps={maxSteps} />
                            </div>
                            <div className="flex-1 text-sm sm:text-base md:text-lg font-bold text-slate-700 leading-snug sm:leading-relaxed bg-blue-50/80 p-3 sm:p-4 rounded-[1rem] border-2 border-blue-100 min-h-[4rem] flex items-center shadow-sm ml-[4.5rem] sm:ml-0">
                                <div key={`speech-${exIdx}-${step}`} className="animate-slideInRight w-full">
                                    {currentStepData.robotSpeech}
                                </div>
                            </div>
                        </div>

                        {/* Controles Nav */}
                        <div className="shrink-0 bg-gradient-to-b from-[#e0e7ff] to-[#c7d2fe] p-2 sm:p-3 w-full flex flex-col items-center border-t-[4px] border-white z-20">
                            <div className="flex justify-center items-stretch w-full max-w-4xl gap-2 sm:gap-4 h-10 sm:h-12">
                                <button
                                    onClick={prevStep}
                                    disabled={step === 0}
                                    className="flex-[0.8] bg-[#a5b4fc] border-b-[4px] border-[#6366f1] text-[#312e81] rounded-l-xl font-black text-sm sm:text-lg flex items-center justify-center gap-1 active:border-b-0 active:translate-y-[4px] disabled:opacity-40 transition-all hover:bg-[#c7d2fe]"
                                >
                                    <ChevronLeft className="w-5 h-5 sm:w-6 sm:h-6 stroke-[3px]" />
                                    <span className="hidden sm:inline">Atrás</span>
                                </button>

                                <div className="bg-[#6366f1] text-white font-black px-3 sm:px-6 text-sm sm:text-xl flex items-center justify-center border-b-[4px] border-[#4338ca] shadow-inner whitespace-nowrap min-w-[4rem]">
                                    Paso {step + 1}/{maxSteps + 1}
                                </div>

                                <button
                                    onClick={nextStep}
                                    className={`flex-[2] border-b-[4px] text-white rounded-r-xl font-black text-sm sm:text-xl flex items-center justify-center gap-2 active:border-b-0 active:translate-y-[4px] transition-all shadow-sm hover:brightness-110 ${
                                        step === maxSteps
                                            ? 'bg-gradient-to-r from-[#10b981] to-[#047857] border-[#065f46] animate-pulse'
                                            : 'bg-gradient-to-r from-[#3b82f6] to-[#2563eb] border-[#1d4ed8]'
                                    }`}
                                >
                                    <span>
                                        {step < maxSteps
                                            ? '¡Siguiente Paso!'
                                            : exIdx < EXERCISES.length - 1
                                            ? `Siguiente Reto`
                                            : '¡Volver!'}
                                    </span>
                                    <ChevronRight className="w-5 h-5 sm:w-6 sm:h-6 stroke-[3px]" />
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
